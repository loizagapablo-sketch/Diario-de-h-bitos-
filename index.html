<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12141A" />
<title>Diario de Misiones</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Diario de Misiones" />
<style>
  html, body { margin: 0; padding: 0; background: #12141A; }
  #root { min-height: 100vh; }
  #boot-status {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    font-family: -apple-system, system-ui, sans-serif;
    color: #EDEAE3;
    text-align: center;
  }
  #boot-status .box { max-width: 420px; }
  #boot-status h2 { color: #E3B23C; font-size: 18px; margin-bottom: 12px; }
  #boot-status p { font-size: 14px; line-height: 1.6; color: #8B8F9B; margin: 6px 0; }
</style>
<script>
  window.onerror = function (message, source, lineno, colno, error) {
    window.__bootError = message + " (línea " + lineno + ")";
    return false;
  };
  // Local, on-device storage shim with the same shape as the Claude artifact
  // storage API (get/set/delete/list), so the app code works unchanged.
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      if (v === null) throw new Error("not found: " + key);
      return { key, value: v, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };
</script>
</head>
<body>
<div id="root">
  <div id="boot-status">
    <div class="box">
      <h2>⏳ Cargando Diario de Misiones…</h2>
    </div>
  </div>
</div>

<script src="bundle.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
  setTimeout(function () {
    var boot = document.getElementById("boot-status");
    if (!boot) return;
    var reason = window.__bootError ? "Error: " + window.__bootError : "No se pudo cargar la app.";
    boot.innerHTML =
      '<div class="box"><h2>⚠️ No se pudo abrir la app</h2><p>' + reason + "</p></div>";
  }, 4000);
</script>
</body>
</html>
